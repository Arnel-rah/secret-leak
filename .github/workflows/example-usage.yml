name: Secrets Leak Audit (example for consumers)

on:
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repo (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install secrets-leak-auditor
        run: go install github.com/Arnel-rah/secret-leak/cmd/audit@latest

      - name: Run audit
        run: audit --repo . --no-color --ci --fail-on high

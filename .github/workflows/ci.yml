name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Run unit tests
        run: go test ./... -v

      - name: Build
        run: go build ./...

  secrets-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history is required -- the whole point is to scan it

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Build auditor
        run: go build -o audit ./cmd/audit

      - name: Audit this repository's own history
        run: ./audit --repo . --no-color --ci --fail-on high --json audit-report.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secrets-audit-report
          path: audit-report.json
